<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- This sets your precise title and cloud logo -->
    <title>junior cloud</title>
    <link rel="icon" type="image/png" href="https://icons8.com">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Using a public proxy URL to bypass connection refusal -->
    <iframe id="game-frame" src="https://allorigins.win"></iframe>

    <script>
        // Double security: Constantly force the title to stay "junior cloud"
        setInterval(() => {
            if (document.title !== "junior cloud") {
                document.title = "junior cloud";
            }
        }, 200);
    </script>

</body>
</html>
