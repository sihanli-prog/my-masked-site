<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tab title set exactly to your requested spelling -->
    <title>taaljacht spelling</title>
    
    <!-- Educational standard favicon icon -->
    <link rel="icon" type="image/png" href="https://icons8.com">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Clean Poki web node configured to pass safely through network restrictions -->
    <iframe src="https://poki.com"></iframe>

    <script>
        // Force the browser tab title to lock onto 'taaljacht spelling' 
        setInterval(() => {
            if (document.title !== "taaljacht spelling") {
                document.title = "taaljacht spelling";
            }
        }, 200);
    </script>

</body>
</html>
