<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tab title updated to exactly: taaljacht -->
    <title>taaljacht</title>
    
    <!-- School platform styled favicon icon -->
    <link rel="icon" type="image/png" href="https://icons8.com">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- This pulls Poki safely inside the page layer -->
    <iframe src="https://allorigins.win"></iframe>

    <script>
        // Locks the tab title to "taaljacht" to bypass teachers glancing at tabs
        setInterval(() => {
            if (document.title !== "taaljacht") {
                document.title = "taaljacht";
            }
        }, 200);
    </script>

</body>
</html>
